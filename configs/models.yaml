# Which LLM provider/models the experiments use.
# Every run copies this file's content into its manifest (results/manifests/).
# Plan: main = model with tool calling; degraded = smaller model of the same family (Phase 5 model_swap).
# Model list checked on https://api-docs.deepseek.com/quick_start/pricing (2026-09-30).

provider: deepseek           # key into `providers` below

providers:
  deepseek:
    sdk: openai              # DeepSeek's API is OpenAI-compatible
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
  openai:
    sdk: openai
    api_key_env: OPENAI_API_KEY
  anthropic:
    sdk: anthropic
    api_key_env: ANTHROPIC_API_KEY

models:
  main: deepseek-v4-pro      # DeepSeek-V4-Pro-0813
  degraded: deepseek-flash   # DeepSeek-V4.1-Flash: smaller and cheaper, used for model_swap
  judge: deepseek-v4-pro     # same as main; self-judging bias is noted as a limitation

defaults:
  max_tokens: 1024
  temperature: 0.0
