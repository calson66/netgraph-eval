# Price snapshot used to compute cost_usd. USD per 1M tokens.
# DeepSeek charges less off-peak and for cache hits. For simplicity we always use the PEAK,
# CACHE-MISS price, so every reported cost is an upper bound.
snapshot_date: "2026-09-30"
source: "https://api-docs.deepseek.com/quick_start/pricing (checked 2026-09-30)"

models:
  deepseek-v4-pro:
    input_per_mtok: 1.32     # peak, cache miss (off-peak 0.66)
    output_per_mtok: 3.96    # peak (off-peak 1.98)
  deepseek-flash:
    input_per_mtok: 0.30     # peak, cache miss (off-peak 0.15)
    output_per_mtok: 1.20    # peak (off-peak 0.60)

budget_usd: 20.0
