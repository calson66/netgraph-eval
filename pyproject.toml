[project]
name = "netgraph-eval"
version = "0.1.0"
description = "Evaluating a ReAct-style Text-to-Cypher agent on a synthetic telecom network graph"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "neo4j>=5.20",
    "anthropic>=0.40",
    "openai>=1.50",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pandas>=2.2",
    "scipy>=1.13",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/netgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "neo4j: needs a running Neo4j (docker compose up -d)",
    "llm: makes a real (paid) LLM API call",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
